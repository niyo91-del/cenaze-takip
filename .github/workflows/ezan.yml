name: Ezan APK olustur
on:
  push:
    branches: [main]
    paths: ['ezan-saati/**', '.github/workflows/ezan.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: ezan-saati
      - name: APK dalina yukle
        run: |
          mkdir /tmp/out && cp ezan-saati/app/build/outputs/apk/debug/app-debug.apk /tmp/out/EzanSaati.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-ezan
          git rm -rf . -q
          cp /tmp/out/EzanSaati.apk .
          git add EzanSaati.apk
          git commit -q -m "APK"
          git push -f origin apk-ezan
