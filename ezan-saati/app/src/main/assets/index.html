<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15395c">
<title>Ezan Saati</title>
<style>
/* Düzen: tek sütun, telefon önce. Lacivert gün kartı, altın rengi sıradaki vakit. Üç sekme: Bugün, Günlük, Aylık. */
:root{
  --bg:#e9f0f5; --card:#ffffff; --ink:#11263b; --muted:#566b7e; --line:#d3dfe8;
  --hero:#15395c; --hero-ink:#eaf3fa; --hero-soft:rgba(255,255,255,.14);
  --accent:#d99a22; --accent-ink:#2b1c00; --soft:#dde9f2; --field:#f6f9fb; --err:#b3261e;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --arab:"Noto Naskh Arabic","Amiri","Traditional Arabic","Geeza Pro","Arabic Typesetting",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1521; --card:#112133; --ink:#e5eef6; --muted:#8aa0b4; --line:#1e3248;
    --hero:#173c61; --accent:#e6ad46; --soft:#18304a; --field:#0e1c2c; --err:#ff8f80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1521; --card:#112133; --ink:#e5eef6; --muted:#8aa0b4; --line:#1e3248;
  --hero:#173c61; --accent:#e6ad46; --soft:#18304a; --field:#0e1c2c; --err:#ff8f80; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-block:12px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px}
button,select,input{font:inherit;color:inherit}
.de{display:block;font-size:.78em;font-weight:400;opacity:.78;line-height:1.25}
.seg{display:grid;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;min-height:46px;border-radius:11px;font-weight:600;color:var(--muted);padding:2px 4px}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
#langs{grid-template-columns:1.3fr 1fr 1fr}
#langs button{min-height:40px;font-size:14px}
#tabs{grid-template-columns:repeat(3,1fr)}
select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-weight:600}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px}
.hero .lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero .next{font-size:34px;font-weight:700;line-height:1.1}
.hero .next .de{font-size:.45em;opacity:.85}
.hero .at{font-size:15px;opacity:.92;font-variant-numeric:tabular-nums}
.count{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.arc{width:100%;height:auto;margin-top:4px}
.date{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.date button,.nav button{border:0;min-width:48px;min-height:48px;border-radius:12px;background:var(--hero-soft);color:var(--hero-ink);font-size:22px}
.date .mid{text-align:center;font-weight:600;min-width:0}
.date .mid small{display:block;font-weight:400;opacity:.85}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;min-height:60px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-size:18px;font-weight:600}
.row .t{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.row.past{color:var(--muted)}
.row.past .n,.row.past .t{font-weight:500}
.row.now{background:var(--accent);color:var(--accent-ink)}
.row.now .de{opacity:.85}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.box h2{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.box h2 .de{display:inline;margin-left:6px;font-size:1em}
.box h2 .de::before{content:"· "}
.box p{margin:0 0 8px}
.box p:last-child{margin-bottom:0}
.ar{direction:rtl;text-align:right;font-family:var(--arab);font-size:27px;line-height:1.9;margin:0 0 10px}
.ref{font-size:13px;color:var(--muted);margin-top:6px}
.qibla{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{color:var(--muted);font-size:13px;margin:0 4px}
.special{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:12px 16px;font-weight:600}
.special .de{opacity:.85}
.rec h3{margin:0 0 2px;font-size:20px}
.meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.rec ul,.rec ol{margin:0 0 8px;padding-left:20px}
.rec li{margin:4px 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.nav .ttl{text-align:center;font-weight:700;min-width:0}
.custom{display:grid;gap:8px}
.custom label{font-size:13px;color:var(--muted)}
.custom input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;min-height:48px;border-radius:12px;background:var(--hero);color:var(--hero-ink);font-weight:600;padding:0 16px}
.err{color:var(--err);font-size:14px;min-height:1em}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;min-width:440px;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:center;font-size:15px;white-space:nowrap}
th{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);line-height:1.2}
th .de{font-size:1em;opacity:.8}
td:first-child,th:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--card)}
tr.today td{background:var(--accent);color:var(--accent-ink);font-weight:700}
tr+tr td{border-top:1px solid var(--line)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>


<div class="wrap">
  <div class="seg" id="langs" role="tablist" aria-label="Dil / Sprache">
    <button data-l="both">Türkçe · Deutsch</button><button data-l="tr">Türkçe</button><button data-l="de">Deutsch</button>
  </div>
  <div class="seg" id="tabs" role="tablist">
    <button data-t="today"></button><button data-t="daily"></button><button data-t="month"></button>
  </div>
  <select id="city" aria-label="Şehir / Stadt"></select>
  <div class="box custom" id="custom" hidden>
    <div><label for="cName" id="lName"></label><input id="cName" type="text" autocomplete="off"></div>
    <div class="two">
      <div><label for="cLat" id="lLat"></label><input id="cLat" type="text" inputmode="decimal" placeholder="50.7374"></div>
      <div><label for="cLon" id="lLon"></label><input id="cLon" type="text" inputmode="decimal" placeholder="7.0982"></div>
    </div>
    <div class="err" id="cErr"></div>
    <button class="btn" id="cSave"></button>
  </div>

  <section id="vToday" class="col"></section>
  <section id="vDaily" class="col" hidden></section>
  <section id="vMonth" class="col" hidden></section>
</div>

<script>
'use strict';
/* ===================== yerler ===================== */
const PLACES=[
 ['Almanya / Deutschland',[['Berlin',52.52,13.405],['Hamburg',53.5511,9.9937],['München',48.1351,11.582],['Köln',50.9375,6.9603],['Frankfurt',50.1109,8.6821],['Stuttgart',48.7758,9.1829],['Düsseldorf',51.2277,6.7735],['Dortmund',51.5136,7.4653],['Essen',51.4556,7.0116],['Bremen',53.0793,8.8017],['Hannover',52.3759,9.732],['Nürnberg',49.4521,11.0767],['Leipzig',51.3397,12.3731],['Duisburg',51.4344,6.7623],['Mannheim',49.4875,8.466]],'Europe/Berlin'],
 ['Türkiye',[['İstanbul',41.0082,28.9784],['Ankara',39.9334,32.8597],['İzmir',38.4237,27.1428],['Bursa',40.1885,29.061],['Antalya',36.8969,30.7133],['Konya',37.8746,32.4932],['Adana',37.0,35.3213],['Gaziantep',37.0662,37.3833],['Kayseri',38.7312,35.4787],['Trabzon',41.0027,39.7168],['Samsun',41.2867,36.33],['Diyarbakır',37.9144,40.2306],['Erzurum',39.9,41.27],['Eskişehir',39.7667,30.5256],['Mersin',36.8,34.6333],['Van',38.4891,43.4089],['Şanlıurfa',37.1591,38.7969],['Malatya',38.3552,38.3095],['Denizli',37.7765,29.0864],['Sivas',39.7477,37.0179]],'Europe/Istanbul'],
 ['Diğer / Weitere',[['Wien',48.2082,16.3738,'Europe/Vienna'],['Zürich',47.3769,8.5417,'Europe/Zurich'],['Amsterdam',52.3676,4.9041,'Europe/Amsterdam'],['Brüssel',50.8503,4.3517,'Europe/Brussels'],['Paris',48.8566,2.3522,'Europe/Paris'],['London',51.5072,-0.1276,'Europe/London']],null]
];
const CITIES=[];
PLACES.forEach(([g,list,tz])=>list.forEach(c=>CITIES.push({name:c[0],lat:c[1],lon:c[2],tz:c[3]||tz,group:g})));
const deviceTz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Berlin'}catch(e){return 'Europe/Berlin'}})();

/* ===================== hesap (Diyanet yöntemi: imsak 18°, yatsı 17°, düzeltmeler dk) ===================== */
const R=Math.PI/180, sin=d=>Math.sin(d*R), cos=d=>Math.cos(d*R), tan=d=>Math.tan(d*R);
const asin=x=>Math.asin(x)/R, acos=x=>Math.acos(x)/R, atan2=(y,x)=>Math.atan2(y,x)/R, acot=x=>Math.atan(1/x)/R;
const fa=a=>a-360*Math.floor(a/360), fh=h=>h-24*Math.floor(h/24);
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545.0,g=fa(357.529+0.98560028*D),q=fa(280.459+0.98564736*D),L=fa(q+1.915*sin(g)+0.020*sin(2*g)),e=23.439-0.00000036*D;
  const RA=fh(atan2(cos(e)*sin(L),cos(L))/15);return{decl:asin(sin(e)*sin(L)),eqt:q/15-RA}}
function calcDay(y,m,d,lat,lon){
  const jd=julian(y,m,d)-lon/360;
  const mid=t=>fh(12-sunPos(jd+t).eqt);
  const ang=(a,t,ccw)=>{const dec=sunPos(jd+t).decl,noon=mid(t),x=(-sin(a)-sin(dec)*sin(lat))/(cos(dec)*cos(lat));return noon+(ccw?-1:1)*acos(x)/15};
  const asr=(f,t)=>{const dec=sunPos(jd+t).decl;return ang(-acot(f+tan(Math.abs(lat-dec))),t,false)};
  let fajr=ang(18,5/24,true),sunrise=ang(0.833,6/24,true),dhuhr=mid(12/24),asrT=asr(1,13/24),sunset=ang(0.833,18/24,false),isha=ang(17,18/24,false);
  const night=fh(sunrise-sunset);
  if(isNaN(fajr)||fh(sunrise-fajr)>18/60*night)fajr=sunrise-18/60*night;
  if(isNaN(isha)||fh(isha-sunset)>17/60*night)isha=sunset+17/60*night;
  const raw=[fajr,sunrise-7/60,dhuhr+5/60,asrT+4/60,sunset+7/60,isha];
  const base=Date.UTC(y,m-1,d);
  return raw.map(h=>Math.round((base+(h-lon/15)*3600000)/60000)*60000);
}
function qiblaDeg(lat,lon){const p2=21.4225,dl=39.8262-lon;return fa(atan2(sin(dl),cos(lat)*tan(p2)-sin(lat)*cos(dl)))}

/* ===================== metinler ===================== */
const PN=[['İmsak','Fadschr'],['Güneş','Sonnenaufgang'],['Öğle','Dhuhr'],['İkindi','Asr'],['Akşam','Maghrib'],['Yatsı','Ischa']];
const MTR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MDE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WTR=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const WDE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const DIR_TR=['kuzey','kuzeydoğu','doğu','güneydoğu','güney','güneybatı','batı','kuzeybatı'];
const DIR_DE=['Norden','Nordosten','Osten','Südosten','Süden','Südwesten','Westen','Nordwesten'];

const AYAHS=[
 {ar:'أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ',tr:'Biliniz ki kalpler ancak Allah\'ı anmakla huzur bulur.',de:'Wahrlich, im Gedenken Gottes finden die Herzen Ruhe.',ref:'Ra\'d 13:28'},
 {ar:'فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا',tr:'Elbette zorluğun yanında bir kolaylık vardır. Gerçekten zorlukla beraber bir kolaylık vardır.',de:'Wahrlich, mit der Schwierigkeit kommt Erleichterung. Wahrlich, mit der Schwierigkeit kommt Erleichterung.',ref:'İnşirâh 94:5-6'},
 {ar:'يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ',tr:'Ey iman edenler! Sabır ve namazla yardım dileyin. Şüphesiz Allah sabredenlerle beraberdir.',de:'Ihr Gläubigen! Sucht Hilfe in Geduld und Gebet. Wahrlich, Gott ist mit den Geduldigen.',ref:'Bakara 2:153'},
 {ar:'لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا',tr:'Allah hiç kimseye gücünün yeteceğinden fazlasını yüklemez.',de:'Gott fordert von keiner Seele mehr, als sie zu leisten vermag.',ref:'Bakara 2:286'},
 {ar:'وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ',tr:'Kim Allah\'a tevekkül ederse, O ona yeter.',de:'Wer auf Gott vertraut, dem genügt Er.',ref:'Talâk 65:3'},
 {ar:'لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا',tr:'Allah\'ın rahmetinden ümidinizi kesmeyin. Şüphesiz Allah bütün günahları bağışlar.',de:'Verzweifelt nicht an der Barmherzigkeit Gottes. Wahrlich, Gott vergibt alle Sünden.',ref:'Zümer 39:53'},
 {ar:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',tr:'De ki: O Allah birdir. Allah sameddir (her şey O\'na muhtaçtır). O doğurmamış ve doğurulmamıştır. Hiçbir şey O\'na denk değildir.',de:'Sprich: Er ist Gott, der Eine, Gott, der Undurchdringliche. Er zeugt nicht und ist nicht gezeugt, und keiner ist Ihm gleich.',ref:'İhlâs 112'},
 {ar:'وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا',tr:'Rabbin, yalnız O\'na kulluk etmenizi ve anne babaya iyilik etmenizi emretti.',de:'Dein Herr hat geboten, dass ihr nur Ihm dient und zu den Eltern gütig seid.',ref:'İsrâ 17:23'},
 {ar:'إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ',tr:'Allah katında en değerliniz, takvâda en ileri olanınızdır.',de:'Der Angesehenste von euch bei Gott ist der Gottesfürchtigste unter euch.',ref:'Hucurât 49:13'},
 {ar:'إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ',tr:'Allah adaleti, iyiliği ve akrabaya yardım etmeyi emreder.',de:'Gott gebietet Gerechtigkeit, Güte und Freigebigkeit gegenüber den Verwandten.',ref:'Nahl 16:90'},
 {ar:'فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ',tr:'Öyleyse beni anın ki ben de sizi anayım. Bana şükredin, nankörlük etmeyin.',de:'Gedenkt Meiner, so gedenke Ich eurer. Seid Mir dankbar und undankbar nicht.',ref:'Bakara 2:152'},
 {ar:'لَئِنْ شَكَرْتُمْ لَأَزِيدَنَّكُمْ',tr:'Andolsun, şükrederseniz size (nimetimi) mutlaka artırırım.',de:'Wenn ihr dankbar seid, werde Ich euch gewiss mehr geben.',ref:'İbrâhîm 14:7'},
 {ar:'اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ',tr:'Allah, kendisinden başka ilah olmayandır. O diridir, her şeyi ayakta tutandır.',de:'Gott, es gibt keinen Gott außer Ihm, dem Lebendigen, dem Beständigen.',ref:'Bakara 2:255 (Âyetü\'l-Kürsî\'den)'},
 {ar:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ',tr:'Hamd, âlemlerin Rabbi Allah\'a mahsustur.',de:'Alles Lob gebührt Gott, dem Herrn der Welten.',ref:'Fâtiha 1:2'},
 {ar:'ادْعُونِي أَسْتَجِبْ لَكُمْ',tr:'Bana dua edin, size karşılık vereyim.',de:'Ruft Mich an, so erhöre Ich euch.',ref:'Mü\'min 40:60'},
 {ar:'فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ',tr:'Şüphesiz ben çok yakınım. Bana dua edenin duasına karşılık veririm.',de:'Ich bin nahe. Ich erhöre den Ruf des Rufenden, wenn er Mich anruft.',ref:'Bakara 2:186'},

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* iki dilli metin */
const P=(tr,de)=>lang==='tr'?tr:lang==='de'?de:`${tr} / ${de}`;
const B=(tr,de)=>lang==='tr'?tr:lang==='de'?de:`${tr}<span class="de">${de}</span>`;
function tzParts(ms,tz){const o={};new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ms)).forEach(x=>o[x.type]=+x.value);return{y:o.year,m:o.month,d:o.day}}
function addDays(s,n){const t=new Date(Date.UTC(s.y,s.m-1,s.d+n));return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}}
const same=(a,b)=>a.y===b.y&&a.m===b.m&&a.d===b.d;
const dow=s=>new Date(Date.UTC(s.y,s.m-1,s.d)).getUTCDay();
const dayNo=s=>Math.floor(Date.UTC(s.y,s.m-1,s.d)/86400000);
const hm=ms=>new Intl.DateTimeFormat('tr-TR',{timeZone:city.tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms));
const dayTimes=s=>calcDay(s.y,s.m,s.d,city.lat,city.lon);
const dateTxt=s=>B(`${s.d} ${MTR[s.m-1]} ${s.y}`,`${s.d}. ${MDE[s.m-1]} ${s.y}`);
const wdTxt=s=>B(WTR[dow(s)],WDE[dow(s)]);
const dirOf=(a,arr)=>arr[Math.round(a/45)%8];
const place=()=>city.name;

/* ===================== görünüm ===================== */
function drawArc(times,now,isToday){
  const sr=times[1],ss=times[4],cx=160,cy=84,r=140;
  const p=a=>[cx+r*Math.cos(a*R),cy-r*0.55*Math.sin(a*R)];
  let t=(now-sr)/(ss-sr);const inDay=isToday&&t>=0&&t<=1;t=Math.min(1,Math.max(0,t));
  const [x,y]=p(180-180*t);
  let path='M '+p(180).join(' ');for(let a=170;a>=0;a-=10)path+=' L '+p(a).join(' ');
  return `<svg class="arc" viewBox="0 0 320 104" role="img" aria-label="${lang==='de'?'Sonnenstand':'Güneşin konumu'}">
   <line x1="10" y1="${cy}" x2="310" y2="${cy}" stroke="currentColor" stroke-opacity=".35"/>
   <path d="${path}" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 5"/>
   ${isToday?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="${inDay?'var(--accent)':'none'}" stroke="var(--accent)" stroke-width="2"/>`:''}
   <text x="14" y="${cy+18}" font-size="12" fill="currentColor" fill-opacity=".85">${hm(sr)}</text>
   <text x="306" y="${cy+18}" font-size="12" fill="currentColor" fill-opacity=".85" text-anchor="end">${hm(ss)}</text></svg>`;
}
function nextSpecial(today){
  const n=dayNo(today);
  for(const [y,m,d,tr,de] of DAYS){const k=dayNo({y,m,d})-n;if(k>=0&&k<=60)return{k,tr,de,y,m,d}}
  return null;
}
function viewToday(){
  const now=Date.now(),today=tzParts(now,city.tz);if(!sel)sel=today;
  const isToday=same(sel,today),times=dayTimes(sel);
  let idx=isToday?times.findIndex(t=>t>now):-1,hero;
  if(isToday){
    const nextAt=idx>=0?times[idx]:dayTimes(addDays(sel,1))[0],pn=PN[idx>=0?idx:0];
    const s=Math.max(0,Math.floor((nextAt-now)/1000));
    hero=`<div class="lbl">${B('Sıradaki vakit','Nächste Gebetszeit')}</div>
      <div class="next">${B(pn[0],pn[1])}</div>
      <div class="at">${idx<0?B('Yarın','Morgen')+' · ':''}${hm(nextAt)}</div>
      <div class="count" id="cnt">${Math.floor(s/3600)} ${lang==='de'?'Std':'sa'} ${pad(Math.floor(s%3600/60))} ${lang==='de'?'Min':'dk'} ${pad(s%60)} ${lang==='de'?'Sek':'sn'}</div>`;
  }else hero=`<div class="lbl">${wdTxt(sel)}</div><div class="next">${dateTxt(sel)}</div>
      <button class="btn" id="back" style="margin-top:6px">${B('Bugüne dön','Zurück zu heute')}</button>`;
  const q=qiblaDeg(city.lat,city.lon);
  const sp=isToday?nextSpecial(today):null;
  return `<div class="hero">${hero}${drawArc(times,now,isToday)}
    <div class="date"><button id="dPrev" aria-label="${P('Önceki gün','Vortag')}">‹</button>
      <div class="mid">${P(`${sel.d} ${MTR[sel.m-1]} ${sel.y}`,`${sel.d}. ${MDE[sel.m-1]} ${sel.y}`)}<small>${P(WTR[dow(sel)],WDE[dow(sel)])} · ${place()}</small></div>
      <button id="dNext" aria-label="${P('Sonraki gün','Folgetag')}">›</button></div></div>
    <div class="list">${PN.map((pn,i)=>{
      const cls=isToday?(i===idx?'now':(idx<0||i<idx?'past':'')):'';
      return `<div class="row ${cls}"><span class="n">${B(pn[0],pn[1])}</span><span class="t">${hm(times[i])}</span></div>`}).join('')}</div>
    ${sp?`<div class="special">${B(sp.tr,sp.de)}<span class="de" style="display:block">${sp.k===0?B('Bugün','Heute'):sp.k===1?B('Yarın','Morgen'):lang==='de'?`in ${sp.k} Tagen · ${sp.d}.${sp.m}.${sp.y}`:lang==='tr'?`${sp.k} gün sonra · ${sp.d}.${sp.m}.${sp.y}`:`${sp.k} gün sonra / in ${sp.k} Tagen · ${sp.d}.${sp.m}.${sp.y}`}</span></div>`:''}
    <div class="box qibla"><span>${B('Kıble yönü (kuzeyden)','Gebetsrichtung (von Norden)')}</span><b>${Math.round(q)}° ${dirOf(q,lang==='de'?DIR_DE:DIR_TR)}</b></div>
    <p class="note">${B('Hesaplama Diyanet yöntemine göredir (imsak 18°, yatsı 17°). Resmi takvimle 1-2 dakika fark olabilir.'+(city.lat>=45?' Yazın kuzey enlemlerde imsak ve yatsı yaklaşık değerdir.':''),'Die Berechnung folgt der Diyanet-Methode (Fadschr 18°, Ischa 17°). Abweichungen von 1-2 Minuten zum offiziellen Kalender sind möglich.'+(city.lat>=45?' Im Sommer sind Fadschr und Ischa in nördlichen Breiten nur Näherungswerte.':''))}</p>`;
}
function viewDaily(){
  const d=sel||tzParts(Date.now(),city.tz),n=dayNo(d);
  const a=AYAHS[n%AYAHS.length],h=HADITHS[(n+7)%HADITHS.length],t=TIPS[(n+3)%TIPS.length],r=RECIPES[n%RECIPES.length],wk=WEEK[dow(d)];
  const srcOf=s=>s?`<div class="ref">${P('Kaynak','Quelle')}: ${s}</div>`:'';
  return `<div class="nav"><button id="gPrev" aria-label="${P('Önceki gün','Vortag')}">‹</button>
      <div class="ttl">${dateTxt(d)}<span class="de">${lang==='de'?WDE[dow(d)]:lang==='tr'?WTR[dow(d)]:WTR[dow(d)]+' / '+WDE[dow(d)]}</span></div>
      <button id="gNext" aria-label="${P('Sonraki gün','Folgetag')}">›</button></div>
    <div class="box"><h2>${B('Günün ayeti','Vers des Tages')}</h2>
      <p class="ar" lang="ar">${a.ar}</p><p>${B(a.tr,a.de)}</p><div class="ref">${a.ref}</div></div>
    <div class="box"><h2>${B('Günün hadisi','Hadith des Tages')}</h2>
      <p>${B(h.tr,h.de)}</p>${srcOf(h.src)}</div>
    <div class="box"><h2>${B('Günün bilgisi','Wissenswertes')}</h2>
      ${wk?`<p>${B(wk.tr,wk.de)}</p>`:''}<p>${B(t.tr,t.de)}</p>${srcOf(t.src)}</div>
    <div class="box rec"><h2>${B('Günün tarifi','Rezept des Tages')}</h2>
      <h3>${B(r.tr,r.de)}</h3>
      <div class="meta">${r.min} ${lang==='de'?'Min':'dk'} · ${r.n} ${P('kişilik','Portionen')}</div>
      <p><b>${B('Malzemeler','Zutaten')}</b></p><ul>${r.ing.map(x=>`<li>${B(x[0],x[1])}</li>`).join('')}</ul>
      <p><b>${B('Yapılışı','Zubereitung')}</b></p><ol>${r.st.map(x=>`<li>${B(x[0],x[1])}</li>`).join('')}</ol></div>
    <p class="note">${B('Meal ve hadis çevirileri serbest çeviridir. Kesin metin ve ayrıntı için güvenilir bir meal, hadis kaynağı veya din görevlisine başvurun.','Die Übersetzungen von Koranversen und Hadithen sind sinngemäß. Für den genauen Wortlaut und Einzelheiten ziehen Sie bitte eine verlässliche Ausgabe oder eine kundige Person zurate.')}</p>`;
}
function viewMonth(){
  const base=sel||tzParts(Date.now(),city.tz),today=tzParts(Date.now(),city.tz);
  const n=new Date(Date.UTC(base.y,base.m,0)).getUTCDate();
  let h=`<div class="nav"><button id="mPrev" aria-label="${P('Önceki ay','Vormonat')}">‹</button>
    <div class="ttl">${B(MTR[base.m-1],MDE[base.m-1])} ${base.y}<span class="de">${place()}</span></div>
    <button id="mNext" aria-label="${P('Sonraki ay','Folgemonat')}">›</button></div>
    <div class="tw"><table><thead><tr><th>${B('Gün','Tag')}</th>${PN.map(p=>`<th>${B(p[0],p[1])}</th>`).join('')}</tr></thead><tbody>`;
  for(let d=1;d<=n;d++){const s={y:base.y,m:base.m,d};
    h+=`<tr class="${same(s,today)?'today':''}"><td>${d} ${WTR[dow(s)].slice(0,3)}</td>${dayTimes(s).map(x=>`<td>${hm(x)}</td>`).join('')}</tr>`}
  return h+'</tbody></table></div>';
}
function chrome(){
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.l===lang));
  const tn={today:['Bugün','Heute'],daily:['Günlük','Täglich'],month:['Aylık','Monat']};
  document.querySelectorAll('#tabs button').forEach(b=>{b.innerHTML=B(...tn[b.dataset.t]);b.setAttribute('aria-selected',b.dataset.t===tab)});
  $('lName').innerHTML=B('Yer adı','Ortsname');$('lLat').innerHTML=B('Enlem','Breitengrad');$('lLon').innerHTML=B('Boylam','Längengrad');
  $('cSave').innerHTML=B('Kaydet','Speichern');$('cName').placeholder=lang==='de'?'z. B. Bonn':'Örn. Bonn';
  fillCities();
}
function render(){
  chrome();
  $('vToday').hidden=tab!=='today';$('vDaily').hidden=tab!=='daily';$('vMonth').hidden=tab!=='month';
  if(tab==='today'){$('vToday').innerHTML=viewToday();
    $('dPrev').onclick=()=>{sel=addDays(sel,-1);render()};$('dNext').onclick=()=>{sel=addDays(sel,1);render()};
    const b=$('back');if(b)b.onclick=()=>{sel=null;render()};}
  else if(tab==='daily'){$('vDaily').innerHTML=viewDaily();
    $('gPrev').onclick=()=>{sel=addDays(sel||tzParts(Date.now(),city.tz),-1);render()};$('gNext').onclick=()=>{sel=addDays(sel||tzParts(Date.now(),city.tz),1);render()};}
  else{$('vMonth').innerHTML=viewMonth();
    const b=sel||tzParts(Date.now(),city.tz);
    $('mPrev').onclick=()=>{sel={y:b.m===1?b.y-1:b.y,m:b.m===1?12:b.m-1,d:1};render()};
    $('mNext').onclick=()=>{sel={y:b.m===12?b.y+1:b.y,m:b.m===12?1:b.m+1,d:1};render()};}
}
function fillCities(){
  const el=$('city'),cur=city===customPlace?'__saved':city.name;
  let h='';
  PLACES.forEach(([g])=>{h+=`<optgroup label="${g}">`+CITIES.filter(c=>c.group===g).map(c=>`<option value="${c.name}">${c.name}</option>`).join('')+'</optgroup>'});
  h+=`<optgroup label="${lang==='de'?'Eigener Ort':'Kendi konumum'}">${customPlace?`<option value="__saved">${customPlace.name.replace(/[<>&"]/g,'')}</option>`:''}<option value="__custom">${lang==='de'?'Koordinaten eingeben…':'Koordinat gir…'}</option></optgroup>`;
  el.innerHTML=h;el.value=cur;
}
function pickCity(name){if(name==='__saved'&&customPlace)return customPlace;return CITIES.find(c=>c.name===name)||null}

/* ===================== olaylar ===================== */
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set('ezan.lang',lang);render()});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('city').onchange=e=>{
  const v=e.target.value;
  if(v==='__custom'){$('custom').hidden=false;$('cName').focus();return}
  $('custom').hidden=true;city=pickCity(v);store.set('ezan.city',v);sel=null;render();
};
$('cSave').onclick=()=>{
  const name=$('cName').value.trim()||(lang==='de'?'Mein Ort':'Konumum'),lat=parseFloat($('cLat').value.replace(',','.')),lon=parseFloat($('cLon').value.replace(',','.'));
  if(!(lat>=-66&&lat<=66)||!(lon>=-180&&lon<=180)){$('cErr').textContent=lang==='de'?'Breitengrad -66 bis 66, Längengrad -180 bis 180. Beispiel: 50.7374 und 7.0982.':'Enlem -66 ile 66, boylam -180 ile 180 arasında olmalı. Örnek: 50.7374 ve 7.0982.';return}
  $('cErr').textContent='';
  customPlace={name,lat,lon,tz:deviceTz,group:'custom'};
  store.set('ezan.custom',JSON.stringify(customPlace));city=customPlace;store.set('ezan.city','__saved');$('custom').hidden=true;sel=null;render();
};
setInterval(()=>{
  if(tab!=='today')return;
  const t=tzParts(Date.now(),city.tz);if(sel&&!same(sel,t))return;
  const el=$('cnt');if(!el){render();return}
  const times=dayTimes(t),now=Date.now(),i=times.findIndex(x=>x>now);
  const at=i>=0?times[i]:dayTimes(addDays(t,1))[0],s=Math.max(0,Math.floor((at-now)/1000));
  if(s===0||s>=86395){render();return}
  el.textContent=`${Math.floor(s/3600)} ${lang==='de'?'Std':'sa'} ${pad(Math.floor(s%3600/60))} ${lang==='de'?'Min':'dk'} ${pad(s%60)} ${lang==='de'?'Sek':'sn'}`;
},1000);

/* ===================== başlat ===================== */
(function(){
  try{const c=JSON.parse(store.get('ezan.custom')||'null');if(c&&isFinite(c.lat)&&isFinite(c.lon))customPlace=c}catch(e){}
  const l=store.get('ezan.lang');if(l==='tr'||l==='de'||l==='both')lang=l;
  city=pickCity(store.get('ezan.city'))||pickCity(deviceTz==='Europe/Istanbul'?'İstanbul':'Berlin');
  render();
})();
</script>

</body>
</html>
